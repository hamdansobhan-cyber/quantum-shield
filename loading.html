<!DOCTYPE html>
<html>

<head>

    <title>Scanning...</title>

    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Orbitron', sans-serif;
        }

        body{

            background:#020617;

            height:100vh;

            display:flex;
            justify-content:center;
            align-items:center;

            overflow:hidden;

            color:white;
        }

        .container{

            text-align:center;
        }

        .loader{

            width:180px;
            height:180px;

            border-radius:50%;

            border:8px solid rgba(255,255,255,0.1);

            border-top:8px solid #38bdf8;

            animation:spin 1s linear infinite;

            margin:auto;
        }

        h1{

            margin-top:40px;

            font-size:42px;

            color:#38bdf8;

            text-shadow:0 0 20px #38bdf8;
        }

        p{

            margin-top:20px;

            color:#94a3b8;

            font-size:18px;
        }

        @keyframes spin{

            100%{
                transform:rotate(360deg);
            }
        }

    </style>

</head>

<body>

    <div class="container">

        <div class="loader"></div>

        <h1>SCANNING TARGET</h1>

        <p>Initializing Threat Intelligence Engine...</p>

    </div>

    <form id="scanForm" action="/scan" method="POST">

        <input type="hidden" name="target" value="{{ target }}">
        <input type="hidden" name="scan_type" value="{{ scan_type }}">

    </form>

    <script>

        setTimeout(() => {

            document.getElementById("scanForm").submit();

        }, 3000);

    </script>

</body>

</html>
