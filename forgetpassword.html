<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Quantum Shield | Reset Password</title>

    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&display=swap"
          rel="stylesheet">

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Orbitron', sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;

            background: #020617;
            color: white;

            background-image:
                linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px);

            background-size: 40px 40px;
        }

        .box {
            width: 430px;
            padding: 40px;

            background: rgba(15,23,42,.95);

            border: 1px solid rgba(56,189,248,.15);
            border-radius: 24px;

            box-shadow:
                0 0 40px rgba(56,189,248,.12);
        }

        .logo {
            text-align: center;

            font-size: 42px;
            font-weight: 900;

            color: #38bdf8;

            text-shadow:
                0 0 15px rgba(56,189,248,.7);

            margin-bottom: 25px;
        }

        h1 {
            text-align: center;
            font-size: 24px;
            margin-bottom: 12px;
        }

        .subtitle {
            text-align: center;
            color: #94a3b8;
            font-size: 12px;
            line-height: 1.7;
            margin-bottom: 30px;
        }

        .error {
            background: rgba(239,68,68,.12);
            border: 1px solid rgba(239,68,68,.3);
            color: #f87171;

            padding: 12px;
            border-radius: 10px;

            font-size: 12px;
            margin-bottom: 20px;
        }

        label {
            display: block;
            color: #cbd5e1;
            font-size: 12px;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 14px;

            background: #020617;
            color: white;

            border: 1px solid #1e293b;
            border-radius: 10px;

            outline: none;
            margin-bottom: 18px;
        }

        input:focus {
            border-color: #38bdf8;

            box-shadow:
                0 0 15px rgba(56,189,248,.2);
        }

        button {
            width: 100%;
            padding: 15px;

            border: none;
            border-radius: 12px;

            background:
                linear-gradient(90deg,#06b6d4,#6366f1);

            color: white;

            font-weight: 700;

            cursor: pointer;

            transition: .3s;
        }

        button:hover {
            transform: translateY(-3px);

            box-shadow:
                0 0 25px rgba(56,189,248,.4);
        }

        .back {
            display: block;

            text-align: center;

            margin-top: 25px;

            color: #38bdf8;

            text-decoration: none;

            font-size: 12px;
        }

        .back:hover {
            text-decoration: underline;
        }

        .warning {
            margin-top: 20px;

            color: #64748b;

            font-size: 10px;

            line-height: 1.6;

            text-align: center;
        }

    </style>

</head>

<body>

<div class="box">

    <div class="logo">
        VAP
    </div>

    <h1>
        Reset Password
    </h1>

    <p class="subtitle">
        Enter your registered email and create a new password
        for your Quantum Shield account.
    </p>

    {% if error %}
    <div class="error">
        {{ error }}
    </div>
    {% endif %}

    <form action="/forgot-password" method="POST">

        <label>
            Email Address
        </label>

        <input
            type="email"
            name="email"
            placeholder="Enter your registered email"
            required
        >

        <label>
            New Password
        </label>

        <input
            type="password"
            name="new_password"
            placeholder="Enter new password"
            minlength="6"
            required
        >

        <label>
            Confirm Password
        </label>

        <input
            type="password"
            name="confirm_password"
            placeholder="Confirm new password"
            minlength="6"
            required
        >

        <button type="submit">
            🔐 Reset Password
        </button>

    </form>

    <a href="/" class="back">
        ← Back to Login
    </a>

    <p class="warning">
        Passwords are securely hashed before being stored.
    </p>

</div>

</body>

</html>
