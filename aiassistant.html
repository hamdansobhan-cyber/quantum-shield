<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quantum Shield | AI Security Assistant</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#020617;color:white}
.container{max-width:1000px;margin:auto;padding:30px 15px}
h1{text-align:center;margin-bottom:8px}
.subtitle{text-align:center;color:#94a3b8;margin-bottom:25px}

.chat{
    background:#0f172a;
    border:1px solid #334155;
    border-radius:15px;
    overflow:hidden;
}
.chat-header{padding:18px;border-bottom:1px solid #334155}
.chat-header h2{font-size:18px}
.chat-header p{color:#94a3b8;font-size:13px;margin-top:5px}

.messages{height:450px;padding:20px;overflow-y:auto}
.message{display:flex;margin-bottom:15px}
.message-content{
    max-width:75%;
    padding:12px 15px;
    border-radius:12px;
    white-space:pre-wrap;
}
.user{justify-content:flex-end}
.user .message-content{background:#2563eb}
.ai .message-content{background:#1e293b}

.welcome{text-align:center;color:#94a3b8;padding:80px 20px}
.quick{padding:15px;border-top:1px solid #334155}
.quick button{
    background:#1e293b;color:white;border:1px solid #475569;
    padding:8px 12px;margin:4px;border-radius:8px;cursor:pointer
}
.quick button:hover{background:#334155}

.input-area{display:flex;gap:10px;padding:15px;border-top:1px solid #334155}
textarea{
    flex:1;resize:none;background:#020617;color:white;
    border:1px solid #475569;border-radius:8px;padding:12px;
    min-height:45px;max-height:120px
}
#sendButton{
    width:90px;border:0;border-radius:8px;
    background:#2563eb;color:white;cursor:pointer
}
#sendButton:disabled{opacity:.5;cursor:not-allowed}
.typing{color:#94a3b8;font-size:13px;margin-bottom:15px}

@media(max-width:650px){
    .message-content{max-width:90%}
    .input-area{flex-direction:column}
    #sendButton{width:100%;height:45px}
}
</style>
</head>

<body>
<div class="container">

    <h1>🤖 AI Security Assistant</h1>
    <p class="subtitle">Quantum Shield security analysis assistant</p>

    <div class="chat">
        <div class="chat-header">
            <h2>Quantum Shield Security AI</h2>
            <p>Online • Ready to help</p>
        </div>

        <div class="messages" id="messages">
            <div class="welcome">
                <h3>Hello! 👋</h3>
                <p>Ask me about your security scan, risks, ports or system security.</p>
            </div>
        </div>

        <div class="quick">
            <button onclick="quickQuestion('Explain my latest scan results')">Explain scan</button>
            <button onclick="quickQuestion('What are the most important security risks?')">Security risks</button>
            <button onclick="quickQuestion('How can I improve the security of this system?')">Improve security</button>
            <button onclick="quickQuestion('Explain what an open port means')">Open port</button>
        </div>

        <div class="input-area">
            <textarea id="messageInput" placeholder="Ask a security question..."></textarea>
            <button id="sendButton" onclick="sendMessage()">SEND</button>
        </div>
    </div>
</div>

<script>
const input = document.getElementById("messageInput");
const messages = document.getElementById("messages");
const sendButton = document.getElementById("sendButton");

async function sendMessage(){
    const message = input.value.trim();

    if(!message) return;

    const welcome = document.querySelector(".welcome");
    if(welcome) welcome.remove();

    addMessage(message,"user");
    input.value = "";
    sendButton.disabled = true;

    const typing = document.createElement("div");
    typing.className = "typing";
    typing.textContent = "Quantum Shield AI is analysing...";
    messages.appendChild(typing);
    scrollBottom();

    try{
        const response = await fetch("/api/chat",{
            method:"POST",
            headers:{"Content-Type":"application/json"},
            body:JSON.stringify({query:message})
        });

        const data = await response.json();
        typing.remove();

        const reply =
            data.reply ||
            data.response ||
            data.message ||
            data.answer ||
            "I could not generate a response.";

        addMessage(reply,"ai");

    }catch(error){
        typing.remove();
        addMessage("Unable to connect to the AI assistant.","ai");
        console.error(error);
    }

    sendButton.disabled = false;
    input.focus();
}

function addMessage(text,type){
    const message = document.createElement("div");
    message.className = "message " + type;

    const content = document.createElement("div");
    content.className = "message-content";
    content.textContent = text;

    message.appendChild(content);
    messages.appendChild(message);
    scrollBottom();
}

function quickQuestion(question){
    input.value = question;
    sendMessage();
}

function scrollBottom(){
    messages.scrollTop = messages.scrollHeight;
}

input.addEventListener("keydown",function(event){
    if(event.key === "Enter" && !event.shiftKey){
        event.preventDefault();
        sendMessage();
    }
});

input.addEventListener("input",function(){
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight,120) + "px";
});
</script>
</body>
</html>
